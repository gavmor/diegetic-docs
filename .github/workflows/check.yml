# Run the skill's executable gate plus end-to-end example renders on every push.
# Uploads review PNG and PDF artifacts on every green commit.
name: check
on: [push, pull_request]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            poppler-utils
          python -m pip install --upgrade pip
          python -m pip install weasyprint fonttools pillow
      - name: Gate + example render
        run: |
          mkdir -p artifacts
          cd examples/minimal-order
          ../../bin/make_plate.py --pages 2 --out assets/paper-plate.png
          ../../bin/fetch_fonts.py --out assets/fonts
          ../../bin/check.py --html order.html
          python3 -m weasyprint order.html order.pdf
          pdftoppm -png -r 150 order.pdf ../../artifacts/order-page
          cp order.pdf ../../artifacts/
      - name: Chart examples
        run: |
          cd examples/charts
          ../../bin/gantt.py --spec production-timetable.json \
            --out ../../artifacts/production-timetable.png
          ../../bin/gantt.py --spec production-timetable.json \
            --out ../../artifacts/production-timetable.pdf
          ../../bin/stepchart.py --spec power-plan.json \
            --out ../../artifacts/power-plan.png
          ../../bin/stepchart.py --spec power-plan.json \
            --out ../../artifacts/power-plan.pdf
      - name: Upload review artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: artifacts/
          if-no-files-found: error
